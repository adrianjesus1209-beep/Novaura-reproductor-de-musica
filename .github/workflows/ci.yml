name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Unit Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK & CMake for TagLib
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache prebuilt TagLib static libraries
        uses: actions/cache@v4
        with:
          path: musikr/src/main/cpp/taglib/pkg
          key: ${{ runner.os }}-taglib-28.2.13676358-${{ hashFiles('musikr/src/main/cpp/build_taglib.sh', 'musikr/src/main/cpp/android.toolchain.cmake', '.gitmodules') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper & TagLib script are executable
        run: chmod +x gradlew musikr/src/main/cpp/build_taglib.sh

      - name: Run Spotless, Unit Tests & Lint
        run: |
          ./gradlew spotlessCheck :musikr:testDebugUnitTest :app:testDebugUnitTest :musikr:lintDebug :app:lintVitalRelease --stacktrace

      - name: Upload Lint & Test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/tests/
            musikr/build/reports/lint-results*.html
            musikr/build/reports/tests/
